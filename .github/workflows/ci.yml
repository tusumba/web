name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: CI required
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build Vite application
        run: npm run build
